name: Diag one test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diag-one-test
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_CMDLINE_TOOLS: "11076708"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

jobs:
  one:
    name: SessionOpenProjectionTest only
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Install Android SDK
        run: |
          set -e
          mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          if [ ! -x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager ]; then
            rm -rf /usr/local/lib/android/sdk/cmdline-tools/latest
            curl -fsSL -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-${{ env.ANDROID_CMDLINE_TOOLS }}_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/sdk
            mv /tmp/sdk/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/latest
          fi
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
      - name: Run one test class
        working-directory: src/android
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          sed -i 's|org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8|' gradle.properties
          sed -i 's|kotlin.daemon.jvmargs=.*|kotlin.daemon.jvmargs=-Xmx4g|' gradle.properties
          sed -i 's|org.gradle.workers.max=.*|org.gradle.workers.max=4|' gradle.properties
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --tests '*SessionOpenProjectionTest*' --stacktrace
